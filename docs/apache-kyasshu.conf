# BEGIN Kyasshu
# Above "# BEGIN WordPress" in the .htaccess of the WordPress root.
<IfModule mod_rewrite.c>
RewriteEngine On

# Cached pages only for GET/HEAD, no query string, not logged in, URL ending in "/"
RewriteCond %{REQUEST_METHOD} ^(GET|HEAD)$
RewriteCond %{QUERY_STRING} ^$
RewriteCond %{HTTP_COOKIE} !(wordpress_logged_in_|wp-postpass_|comment_author_) [NC]
RewriteCond %{HTTP_HOST} ^[A-Za-z0-9.-]+$
RewriteCond %{REQUEST_URI} /$
RewriteRule ^ - [E=KYS_OK:1,E=KYS_FS:/var/www/example/wp-content/cache/wp-rocket/%{HTTP_HOST}%{REQUEST_URI}index.html,E=KYS_WEB:/wp-content/cache/wp-rocket/%{HTTP_HOST}%{REQUEST_URI}index.html]

# Dictionary the browser has (dcb/dcz): its hash is the file suffix
RewriteCond %{ENV:KYS_OK} =1
RewriteCond %{HTTP:Available-Dictionary} ^:([A-Za-z0-9]{43})=:$
RewriteRule ^ - [E=KYS_DICT:%1]

# Best file the browser accepts: dcz > dcb > zstd > br > gzip > plain
# dcz
RewriteCond %{ENV:KYS_OK} =1
RewriteCond %{HTTP:Accept-Encoding} \bdcz\b [NC]
RewriteCond %{ENV:KYS_DICT} !=""
RewriteCond "%{ENV:KYS_FS}_dcz_%{ENV:KYS_DICT}" -f
RewriteRule ^ "%{ENV:KYS_WEB}_dcz_%{ENV:KYS_DICT}" [L,E=no-gzip:1,E=no-brotli:1]
# dcb
RewriteCond %{ENV:KYS_OK} =1
RewriteCond %{HTTP:Accept-Encoding} \bdcb\b [NC]
RewriteCond %{ENV:KYS_DICT} !=""
RewriteCond "%{ENV:KYS_FS}_dcb_%{ENV:KYS_DICT}" -f
RewriteRule ^ "%{ENV:KYS_WEB}_dcb_%{ENV:KYS_DICT}" [L,E=no-gzip:1,E=no-brotli:1]
# zstd
RewriteCond %{ENV:KYS_OK} =1
RewriteCond %{HTTP:Accept-Encoding} \bzstd\b [NC]
RewriteCond "%{ENV:KYS_FS}_zst" -f
RewriteRule ^ "%{ENV:KYS_WEB}_zst" [L,E=no-gzip:1,E=no-brotli:1]
# br
RewriteCond %{ENV:KYS_OK} =1
RewriteCond %{HTTP:Accept-Encoding} \bbr\b [NC]
RewriteCond "%{ENV:KYS_FS}_br" -f
RewriteRule ^ "%{ENV:KYS_WEB}_br" [L,E=no-gzip:1,E=no-brotli:1]
# gzip
RewriteCond %{ENV:KYS_OK} =1
RewriteCond %{HTTP:Accept-Encoding} \bgzip\b [NC]
RewriteCond "%{ENV:KYS_FS}_gzip" -f
RewriteRule ^ "%{ENV:KYS_WEB}_gzip" [L,E=no-gzip:1,E=no-brotli:1]
# plain
RewriteCond %{ENV:KYS_OK} =1
RewriteCond "%{ENV:KYS_FS}" -f
RewriteRule ^ "%{ENV:KYS_WEB}" [L]
</IfModule>

# Headers per encoding (the files are already compressed: no second compression)
<IfModule mod_headers.c>
<FilesMatch "^index\.html_gzip$">
    ForceType "text/html; charset=UTF-8"
    SetEnv no-gzip 1
    SetEnv no-brotli 1
    Header set Content-Encoding gzip
    Header merge Vary "Accept-Encoding, Available-Dictionary"
</FilesMatch>
<FilesMatch "^index\.html_br$">
    ForceType "text/html; charset=UTF-8"
    SetEnv no-gzip 1
    SetEnv no-brotli 1
    Header set Content-Encoding br
    Header merge Vary "Accept-Encoding, Available-Dictionary"
</FilesMatch>
<FilesMatch "^index\.html_zst$">
    ForceType "text/html; charset=UTF-8"
    SetEnv no-gzip 1
    SetEnv no-brotli 1
    Header set Content-Encoding zstd
    Header merge Vary "Accept-Encoding, Available-Dictionary"
</FilesMatch>
<FilesMatch "^index\.html_dcb_[A-Za-z0-9]{43}$">
    ForceType "text/html; charset=UTF-8"
    SetEnv no-gzip 1
    SetEnv no-brotli 1
    Header set Content-Encoding dcb
    Header merge Vary "Accept-Encoding, Available-Dictionary"
</FilesMatch>
<FilesMatch "^index\.html_dcz_[A-Za-z0-9]{43}$">
    ForceType "text/html; charset=UTF-8"
    SetEnv no-gzip 1
    SetEnv no-brotli 1
    Header set Content-Encoding dcz
    Header merge Vary "Accept-Encoding, Available-Dictionary"
</FilesMatch>
# The dictionary itself: the browser keeps it and uses it for all pages of the site
<FilesMatch "^[A-Za-z0-9]{43}\.dict$">
    ForceType text/plain
    Header set Use-As-Dictionary "match=\"/*\", match-dest=(\"document\")"
    Header set Cache-Control "public, max-age=2592000"
</FilesMatch>
</IfModule>
# END Kyasshu
